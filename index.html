  <title>Alexander Marsh</title>
  <meta name="description" content="Alexander Marsh: data science and statistics at the University of Michigan.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23123a3a'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' font-style='italic' text-anchor='middle' fill='%23f6f1e6'%3Eam%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #05070d;
      --white: #ffffff;
      --bridge: #e25a2c; /* the red of the bridges */
      --font-name: "the-seasons", "Newsreader", Georgia, serif; /* The Seasons, from the Adobe Fonts kit */
      --font-serif: "Newsreader", Georgia, "Times New Roman", serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
    body { font-family: var(--font-serif); color: var(--white); -webkit-font-smoothing: antialiased; }

    /* The ASCII scene is drawn on this canvas (see the script below). */
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; filter: saturate(1.25) contrast(1.05); }

    /* Tilt-shift: the top and bottom of the view are blurred like a scale model. */
    .tilt { position: fixed; left: 0; right: 0; height: 16%; pointer-events: none; z-index: 1; }
    .tilt.top    { top: 0;    backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
                   -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 100%); mask-image: linear-gradient(to bottom, #000 0%, transparent 100%); }
    .tilt.bottom { bottom: 0; backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
                   -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 100%);    mask-image: linear-gradient(to top, #000 0%, transparent 100%); }

    /* Soft vignette plus a gentle scrim so the white text stays readable. */
    .shade { position: fixed; inset: 0; pointer-events: none; z-index: 2;
      background:
        radial-gradient(ellipse 58% 24% at 50% 88%, rgba(4, 22, 24, .68), rgba(4, 22, 24, 0) 100%),
        radial-gradient(ellipse at 50% 45%, rgba(0, 0, 0, 0) 60%, rgba(2, 14, 16, .45) 100%); }

    .content { position: fixed; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      padding: 1rem 16px 3.5vh; text-align: center; }
    h1 { margin: 0; font-family: var(--font-name); font-weight: 700; font-style: normal; font-size: clamp(2.3rem, 5.6vw, 4.4rem); line-height: 1.05; letter-spacing: .01em;
      color: var(--bridge); text-shadow: 0 2px 26px rgba(0, 0, 0, .7), 0 0 2px rgba(0, 0, 0, .5); }
    .links { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: .5rem 2rem; margin: 1rem 0 0; padding: 0; list-style: none; max-width: 60rem; }
    .links a { font-size: clamp(1.1rem, 2.5vw, 1.4rem); font-style: italic; font-weight: 400; letter-spacing: .01em;
      color: var(--white); text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: .28em;
      text-shadow: 0 1px 14px rgba(0, 0, 0, .7); transition: color .2s, text-decoration-thickness .2s; }
    .links a:hover, .links a:focus-visible { color: var(--bridge); text-decoration-thickness: 2.5px; outline: none; }
    .links a:focus-visible { outline: 2px solid rgba(255, 255, 255, .6); outline-offset: 4px; border-radius: 2px; }

    .js .content > * { opacity: 0; animation: rise 1.4s ease-out forwards; }
    .js .content h1 { animation-delay: .5s; }
    .js .content .links { animation-delay: 1s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .js .content > * { animation: none; opacity: 1; } }
  </style>
  <script>document.documentElement.classList.add('js');</script>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="tilt top" aria-hidden="true"></div>
  <div class="tilt bottom" aria-hidden="true"></div>
  <div class="shade" aria-hidden="true"></div>

  <main class="content">
    <h1>alexander marsh</h1>
    <ul class="links">
      <li><a href="assets/Alexander-Marsh-Resume.pdf" target="_blank" rel="noopener">resume</a></li>
      <li><a href="mailto:groethe@umich.edu">email</a></li>
      <li><a href="portfolio/">portfolio</a></li>
    </ul>
  </main>

  <script>
  /* ASCII night garden: cherry trees in full bloom glowing over a still pond, paper lanterns on poles,
     two red arched bridges, a stone lantern on a rock bank and a tiered fountain, with everything
     mirrored in the water. No libraries: every glyph's colour and character is computed from a
     hand-built scene and drawn to the canvas as coloured monospace text. The bank, trees and bridges
     are computed once and cached; the blossoms shimmer, the lanterns flicker, the pond ripples and
     petals fall every frame.
     Tips: add ?t=6 to the URL to freeze the scene at a moment in time; press Space to pause. */
  (function () {
    var canvas = document.getElementById('scene');
    var ctx = canvas.getContext('2d');
    if (!ctx) return;
    var staticCv = document.createElement('canvas');
    var sctx = staticCv.getContext('2d');

    var FONT = 'ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace';
    var BG = '#05070d';
    var DPR = Math.min(window.devicePixelRatio || 1, 2);
    var DESIGN_W = 1.78; // the scene is composed in a 1.78 x 1 space
    var ZOOM = 1.0;
    var WL = .625;       // water line: the mirror axis for reflections

    var W, H, cols, rows, cw, lh, fs, kk, cx = .9, cy = .5, gA, n, rowWL;
    var kind, stChar, stKey, bL, bPh, refR, refG, refB, dynIdx, dynChar, dynKey, ready = false;

    /* ---------- tiny noise helpers ---------- */
    function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
    function hash(x, y) { var h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); }
    function ihash(x, y, k) {
      var h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(k | 0, 1274126177)) | 0;
      h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
      return (h >>> 0) / 4294967295;
    }
    function vnoise(x, y) {
      var xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
      var a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
      var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    }
    function fbm(x, y) { return vnoise(x, y) * .6 + vnoise(x * 2.1 + 5.2, y * 2.1 + 1.3) * .4; }
    function segDist(x, y, ax, ay, bx, by) {
      var dx = bx - ax, dy = by - ay, f = clamp(((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy), 0, 1);
      return Math.hypot(x - (ax + dx * f), y - (ay + dy * f));
    }
    function ell(x, y, ex, ey, rx, ry) { var dx = (x - ex) / rx, dy = (y - ey) / ry; return dx * dx + dy * dy < 1; }

    /* ---------- scene description (design space) ---------- */
    // Paper lanterns on poles: [refX, refY, big], converted from the reference layout.
    var LAMPS = [[3, 185, 0], [48, 235, 0], [115, 237, 0], [135, 196, 0], [205, 201, 0], [242, 222, 1], [266, 203, 0], [321, 235, 0],
      [362, 242, 1], [380, 215, 0], [429, 235, 1], [484, 220, 0], [537, 225, 1], [578, 215, 0], [603, 213, 0], [640, 213, 0], [685, 213, 0]]
      .map(function (a) { var rx = a[2] ? .03 : .021; return { x: a[0] / 800 * 1.78, y: a[1] / 534, rx: rx, ry: rx * 1.3 }; });
    var TRUNKS = [[.12, .012], [.33, .010], [.66, .012], [.84, .010], [1.24, .012], [1.33, .010], [1.58, .016]];
    var BRIDGES = [{ x0: .07, x1: .42, base: .545, rise: .05 }, { x0: 1.02, x1: 1.30, base: .566, rise: .028 }];

    var TORO = { x: .74, y: .492 };
    function glowAt(x, y) {
      var g = 0, tdx = x - TORO.x, tdy = y - TORO.y, td2 = tdx * tdx + tdy * tdy;
      g += 1.7 * (Math.exp(-td2 / .0038) + .9 * Math.exp(-td2 / .0009));
      for (var i = 0; i < LAMPS.length; i++) {
        var L = LAMPS[i], dx = x - L.x, dy = y - L.y;
        var d2 = dx * dx + dy * dy; g += (L.rx > .025 ? 1.6 : 1) * (Math.exp(-d2 / .0038) + .9 * Math.exp(-d2 / .0009));
      }
      return g;
    }
    // Northern cardinals perched on the branches: [x, y of the perch, facing]
    var CARDINALS = [[.40, .235, 1], [1.52, .269, -1]];
    function cardinalPixel(x, y, B) {
      var lx = (x - B[0]) * B[2] / 1.7, ly = (B[1] - y) / 1.7 - .017;
      if (lx < -.052 || lx > .042 || ly < -.007 || ly > .045) return false;
      if (ell(lx, ly, .0335, .010, .0058, .0036)) { oc = '>'; oR = 245; oG = 154; oB = 52; return true; }                  // beak
      if (Math.hypot(lx - .0245, ly - .0115) < .0062) { oc = '#'; oR = 36; oG = 12; oB = 14; return true; }                 // black face
      if (Math.hypot(lx - .019, ly - .0145) < .0125 || ell(lx, ly, .011, .029, .0055, .0095)) { oc = '@'; oR = 224; oG = 28; oB = 42; return true; } // head and crest
      if (ell(lx, ly, -.006, .002, .0145, .0095)) { oc = '#'; oR = 168; oG = 18; oB = 32; return true; }                   // wing
      if (ell(lx, ly, 0, 0, .0225, .0168)) { oc = '@'; oR = 214; oG = 26; oB = 40; return true; }                          // body
      if (ell(lx, ly, -.03, -.008, .023, .0058)) { oc = '='; oR = 160; oG = 18; oB = 30; return true; }                    // tail
      if (Math.abs(lx - .002) < .0016 && ly < -.0145 && ly > -.021) { oc = '|'; oR = 90; oG = 60; oB = 44; return true; } // leg
      return false;
    }

    function bankBottom(x) { return x < .13 ? .66 : x < 1.07 ? .665 + .014 * (vnoise(x * 14, 1) - .5) : .625 + .012 * (vnoise(x * 11, 4) - .5); }
    function landTop(x) { return .525 + .02 * (vnoise(x * 9, 3) - .5); }
    function canopyBottom(x) {
      return .30 + .1 * (fbm(x * 3, 4) - .5) * 2 + .22 * Math.exp(-Math.pow(x / .28, 2)) + .20 * Math.exp(-Math.pow((x - 1.55) / .4, 2))
        + .12 * Math.exp(-Math.pow((x - .95) / .22, 2)) + .06 * Math.exp(-Math.pow((x - .15) / .1, 2));
    }

    /* ---------- output state for one cell ---------- */
    var K = 0, oc = ' ', oR = 0, oG = 0, oB = 0, oL = 0;
    function put(set, b, c, r, R, G, B) {
      b = clamp(b, 0, 1);
      var idx = Math.floor(clamp(b + (hash(c, r) - .5) * .2, 0, .999) * set.length);
      oc = set.charAt(idx);
      var f = .6 + .8 * b;
      oR = R * f; oG = G * f; oB = B * f;
    }
    function blossomColor(L) {
      L = clamp(L, 0, 1.3);
      var k;
      if (L < .7) { k = L / .7; oR = 96 + 159 * k; oG = 40 + 112 * k; oB = 64 + 70 * k; }
      else { k = (L - .7) / .6; oR = 255; oG = 152 + 50 * k; oB = 134 + 30 * k; }
      oc = '.:*o@'.charAt(Math.floor(clamp(L / 1.31, 0, .999) * 5));
    }

    /* ---------- the fixed scene (everything except water, blossom shimmer and lantern flicker) ---------- */
    function evalScene(c, r) {
      var u = (c + .5) * cw / H, v = (r + .5) * lh / H;
      var x = (u - gA / 2) / kk + cx, y = (v - .5) / kk + cy;
      var i, g, d, nz, lit, L, f;
      K = 0;
      var gl = glowAt(x, y);
      lit = clamp(.28 + gl * 1.1, 0, 1.3);

      // foreground stone edge, bottom right
      if (x > 1.40 && y > .90 - (x - 1.40) * .25) {
        var jx = ((x - 1.4) * 9 + (y - .9) * 2) % 1, jy = (y * 26) % 1;
        if (jx < .06 || jy < .1) put('=-', .2, c, r, 60, 48, 42);
        else put('%#=', .4 + .3 * vnoise(x * 50, y * 50), c, r, 138, 112, 96);
        return;
      }
      // tiered stone fountain on a mossy rock in the pond (left)
      if (ell(x, y, .30, .77, .17, .045 + .01 * vnoise(x * 20, 6))) {
        put('%#=', .22 + .35 * vnoise(x * 70, y * 70), c, r, 78, 92, 70); return;
      }
      if (ell(x, y, .30, .735, .095, .014) || ell(x, y, .30, .645, .05, .009)) {
        put('=-', .6 + .3 * Math.sin(x * 120), c, r, 156, 164, 176); return;
      }
      if (Math.abs(x - .30) < .006 && y > .64 && y < .75) { put('|I', .5, c, r, 130, 136, 150); return; }
      if (Math.hypot(x - .30, y - .628) < .0065) { put('o', .6, c, r, 170, 176, 188); return; }
      // flat stepping stones in the pond
      if (ell(x, y, 1.08, .712, .06, .014) || ell(x, y, 1.2, .73, .045, .012) || ell(x, y, 1.0, .735, .04, .011)) {
        put('=%', .4 + .3 * vnoise(x * 60, y * 60), c, r, 150, 120, 98); return;
      }

      // bridges (red arched wooden bridges)
      for (i = 0; i < BRIDGES.length; i++) {
        var B = BRIDGES[i];
        if (x < B.x0 - .01 || x > B.x1 + .01) continue;
        var xm = (B.x0 + B.x1) / 2, hw = (B.x1 - B.x0) / 2, q = (x - xm) / hw;
        if (Math.abs(q) > 1.03) continue;
        var deck = B.base - B.rise * (1 - q * q);
        if (y >= deck - .004 && y < deck + .011) { put('=H', .65 + .2 * Math.sin(x * 400), c, r, 226, 90, 44); return; }                // deck
        if (y >= deck + .011 && y < deck + .02 && Math.abs(q) < .97) { put('#=', .22, c, r, 74, 34, 26); return; }                   // underside shadow
        var post = ((x - B.x0) / .022) % 1;
        if (y < deck - .004 && y > deck - .034) {
          if (post < .16 || post > .98) { put('|I', .75, c, r, 232, 96, 48); return; }                                               // railing posts
          if (y > deck - .0095 || (y < deck - .027)) { put('=-', .7, c, r, 226, 92, 46); return; }                                   // rails
        }
      }

      // cardinals on the high branches
      for (i = 0; i < CARDINALS.length; i++) {
        if (Math.abs(x - CARDINALS[i][0]) < .09 && Math.abs(y - CARDINALS[i][1]) < .09 && cardinalPixel(x, y, CARDINALS[i])) return;
      }

      // water: filled in every frame (mirror of everything above)
      var onBank = x < .13 || x > .43;
      var wTop = onBank ? bankBottom(x) : .575;
      if (y > wTop) { K = 3; return; }

      // stone lantern (toro) on the rocks: a glowing fire box under a curved roof
      var tx = x - TORO.x, ta = Math.abs(tx);
      if (ta < .04 && y > .43 && y < .566) {
        if (y > .548 && ta < .026) { put('#%', .5 + gl * .25, c, r, 150, 126, 104); return; }                                       // base
        if (y > .52 && y <= .548 && ta < .0105) { put('|I', .55 + gl * .25, c, r, 150, 126, 104); return; }                         // post
        if (y > .468 && y <= .52 && ta < .027) {                                                                                    // fire box
          var wy = (y - .494) / .026, wx = tx / .0155;
          if (ta < .0155 && Math.abs(wy) < 1) {                                                                                     // window
            K = 2; oL = 5;
            if (wx * wx + wy * wy > .6) { oc = 'O'; oR = 255; oG = 168; oB = 74; } else { oc = '@'; oR = 255; oG = 247; oB = 214; }
            return;
          }
          put('#%', .55 + gl * .25, c, r, 158, 134, 110); return;
        }
        var rh = (.468 - y) / .035;                                                                                                 // swept roof
        if (y > .43 && y <= .468 && ta < .04 - rh * .026) { put('=#', .6 + gl * .25, c, r, 164, 140, 114); return; }
        if (Math.hypot(tx, y - .424) < .008) { put('o', .7, c, r, 164, 140, 114); return; }
      }

      // paper lanterns and their poles
      for (i = 0; i < LAMPS.length; i++) {
        g = LAMPS[i];
        var ldx = (x - g.x) / g.rx, ldy = (y - g.y) / g.ry;
        var lq = ldx * ldx + ldy * ldy;
        if (lq < 1) {
          K = 2; oL = i;
          if (ldy < -.8 || ldy > .84) { oc = '='; oR = 78; oG = 44; oB = 32; }                      // dark top and bottom caps
          else if (lq > .6) { oc = 'O'; oR = 255; oG = 168; oB = 74; }                              // glowing orange rim
          else if (Math.abs(Math.abs(ldx) - .42) < .09) { oc = '|'; oR = 236; oG = 176; oB = 96; }  // paper ribs
          else { oc = '@'; oR = 255; oG = 247 - ldy * 10; oB = 214 - ldy * 30; }                    // bright core
          return;
        }
        if (Math.abs(x - g.x) < .0019 && y > g.y + g.ry && y < .53) { put('|', .5 + gl * .2, c, r, 120, 92, 66); return; }
      }

      // the bank: rocks in the middle, shrubs elsewhere
      var lt = landTop(x);
      if (y > lt) {
        if (x > .43 && x < 1.07) {
          var gsz = .03, gx = Math.floor(x / gsz), gy = Math.floor(y / gsz), best = 9;
          for (var ox = -1; ox <= 1; ox++) for (var oy = -1; oy <= 1; oy++) {
            var jx2 = (gx + ox + .2 + .6 * ihash(gx + ox, gy + oy, 1)) * gsz, jy2 = (gy + oy + .2 + .6 * ihash(gx + ox, gy + oy, 2)) * gsz;
            best = Math.min(best, Math.hypot(x - jx2, y - jy2) / gsz);
          }
          if (y < lt + .02 && vnoise(x * 40, y * 40) > .45) { put('.:+o', .25 + lit * .5, c, r, 36, 78, 38); return; }                // moss and shrubs on top
          if (best < .62) { put('%#=', .2 + lit * .5 + (vnoise(x * 70, y * 70) - .5) * .2, c, r, 150, 118, 94); return; }          // boulder
          put(':.', .1 + lit * .2, c, r, 40, 30, 26); return;                                                                      // crack
        }
        // shrubs
        nz = fbm(x * 30, y * 30);
        if (nz > .36) put('.:+o', .2 + lit * .55 + (nz - .5) * .4, c, r, 52 + gl * 40, 92 + gl * 50, 40);
        else put(',.', .1 + lit * .2, c, r, 28, 42, 28);
        return;
      }

      // trunks and branches
      for (i = 0; i < TRUNKS.length; i++) {
        var T = TRUNKS[i];
        if (Math.abs(x - T[0] - .01 * Math.sin(y * 12 + i)) < T[1] && y > canopyBottom(T[0]) - .06 && y < lt) { put('|I!', .35 + lit * .45, c, r, 120, 78, 58); return; }
      }
      var bd = Math.min(segDist(x, y, 0, .28, .62, .21), segDist(x, y, 1.78, .22, 1.3, .31), segDist(x, y, .2, .26, .05, .38));
      if (bd < .012) { put('#=', .32 + lit * .4, c, r, 104, 68, 54); return; }

      // cherry blossoms
      var cb = canopyBottom(x);
      if (y < cb) {
        var gap = Math.exp(-(Math.pow((x - 1.18) / .34, 2) + Math.pow((y - .06) / .16, 2)));
        nz = fbm(x * 12, y * 12) * .7 + vnoise(x * 36, y * 36) * .3;
        var fade = clamp((cb - y) / .05, 0, 1);
        if (nz + .22 * fade - gap * .5 > .45) {
          K = 1; oL = .5 + gl * .7 + (nz - .5) * 1.0 + .2 * fade; return;
        }
        if (gap > .45) { // night sky through the gap
          if (hash(c, r) > .993) put('.', .9, c, r, 180, 190, 255);
          else { oc = ' '; oR = 0; oG = 0; oB = 0; }
          return;
        }
        put(',.', .12 + lit * .3, c, r, 60, 30, 46); return;                                                                          // dark branches and shadow
      }
      // far dark woods behind everything
      put(':.+', .3 + lit * .5 + (vnoise(x * 60, y * 60) - .5) * .25, c, r, 104, 92, 56);
    }

    /* ---------- petals ---------- */
    var PETALS = [];
    for (var pi = 0; pi < 110; pi++) {
      PETALS.push({ ox: hash(pi, 7.7) * 2.0 - .1, oy: hash(pi, 5.3) * .6, life: 14 + hash(pi, 2.1) * 12, ph: hash(pi, 8.8) * 30,
        vx: -(.012 + hash(pi, 1.1) * .03), vy: .02 + hash(pi, 4.4) * .035, sw: .012 + hash(pi, 6.1) * .03, sp: .6 + hash(pi, 3.9),
        ch: ['*', "'", '`', ',', '.'][pi % 5] });
    }

    /* ---------- cached static layer, water reflections, per-frame updates ---------- */
    function keyOf() { return ((clamp(oR, 0, 255) >> 3) << 10) | ((clamp(oG, 0, 255) >> 3) << 5) | (clamp(oB, 0, 255) >> 3); }
    var colorCache = {};
    function cssFor(k) { return colorCache[k] || (colorCache[k] = 'rgb(' + ((k >> 10) << 3) + ',' + (((k >> 5) & 31) << 3) + ',' + ((k & 31) << 3) + ')'); }

    function paintBuckets(target, idxs, count, charsArr, keysArr) {
      var buckets = {}, k, j, ii;
      for (j = 0; j < count; j++) { ii = idxs ? idxs[j] : j; k = keysArr[ii]; if (k < 0) continue; (buckets[k] || (buckets[k] = [])).push(ii); }
      for (k in buckets) {
        target.fillStyle = cssFor(+k);
        var arr = buckets[k];
        for (j = 0; j < arr.length; j++) { ii = arr[j]; target.fillText(charsArr[ii], (ii % cols) * cw, Math.floor(ii / cols) * lh + lh / 2); }
      }
    }

    function buildStatic() {
      var i = 0, r, c, list = [];
      kind = new Uint8Array(n); bL = new Float32Array(n); bPh = new Float32Array(n);
      refR = new Uint8Array(n); refG = new Uint8Array(n); refB = new Uint8Array(n);
      stChar = new Array(n); stKey = new Int32Array(n).fill(-1);
      for (r = 0; r < rows; r++) {
        for (c = 0; c < cols; c++, i++) {
          evalScene(c, r);
          kind[i] = K;
          if (K === 1) { bL[i] = oL; bPh[i] = hash(c * .37, r * .53) * 40; blossomColor(oL); }
          else if (K === 2) { bPh[i] = oL * 3.1; }
          if (K !== 3) { refR[i] = clamp(oR, 0, 255); refG[i] = clamp(oG, 0, 255); refB[i] = clamp(oB, 0, 255); }
          if (K === 0) { stChar[i] = oc; stKey[i] = keyOf(); } else list.push(i);
          if (K === 2) { dynChar0[i] = oc; }
        }
      }
      dynIdx = new Int32Array(list);
      dynChar = new Array(n); dynKey = new Int32Array(n).fill(-1);
      staticCv.width = canvas.width; staticCv.height = canvas.height;
      sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      sctx.fillStyle = BG; sctx.fillRect(0, 0, W, H);
      sctx.font = 'bold ' + fs + 'px ' + FONT; sctx.textBaseline = 'middle'; sctx.textAlign = 'left';
      paintBuckets(sctx, null, n, stChar, stKey);
      ready = true;
    }
    var dynChar0 = [];

    function dynCell(i, c, r, t) {
      var k = kind[i], b, f;
      if (k === 1) { // blossoms shimmer and sway
        b = bL[i] + .2 * Math.sin(t * 1.5 + bPh[i]) + .1 * Math.sin(t * .7 + c * .05 + bPh[i] * .3);
        blossomColor(b);
      } else if (k === 2) { // lanterns breathe
        f = .86 + .14 * Math.sin(t * 4.2 + bPh[i]) * Math.sin(t * 2.3 + bPh[i] * 2);
        oc = dynChar0[i]; oR = refR[i] * f; oG = refG[i] * f; oB = refB[i] * f;
      } else { // pond: mirror image with ripples
        var depth = clamp((r - rowWL) / Math.max(1, rows - rowWL), 0, 1);
        var rip = Math.round(Math.sin(t * 1.4 + c * .21 + r * .7) * (.4 + depth * .9));
        var sr = 2 * rowWL - r + rip, sc = c + Math.round(Math.sin(t * .9 + r * .35) * 1.2);
        var R = 5, G = 12, B = 18, lum = 0;
        if (sr >= 0 && sr < rowWL && sc >= 0 && sc < cols) {
          var bi = -1, bl = -1, dr, ri, l2;
          for (dr = -1; dr <= 1; dr++) { // smear a little vertically so lights stretch like reflections
            var rr = sr + dr; if (rr < 0 || rr >= rows) continue;
            ri = rr * cols + sc; if (kind[ri] === 3) continue;
            l2 = refR[ri] + refG[ri] + refB[ri];
            if (l2 > bl) { bl = l2; bi = ri; }
          }
          if (bi >= 0) {
            var dim = .9 - .32 * depth;
            R += refR[bi] * dim; G += refG[bi] * dim; B += refB[bi] * dim;
            lum = (refR[bi] + refG[bi] + refB[bi]) / 3 * dim;
          }
        }
        var sheen = Math.sin(t * 1.1 + c * .5 + r * 1.3 + hash(c, r) * 6);
        if (sheen > .93) { R += 24; G += 36; B += 46; lum += 25; }
        oR = R; oG = G; oB = B;
        oc = lum > 95 ? '|' : lum > 62 ? '!' : lum > 38 ? ':' : lum > 22 ? '~' : '-';
      }
    }

    function resize() {
      W = window.innerWidth; H = window.innerHeight;
      fs = clamp(W / 330 / .6, 5.5, 9);
      canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.font = 'bold ' + fs + 'px ' + FONT;
      ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
      cw = ctx.measureText('M').width; lh = Math.round(fs * 1.2);
      cols = Math.ceil(W / cw); rows = Math.ceil(H / lh); n = cols * rows;
      gA = W / H;
      kk = Math.max(gA / DESIGN_W, 1) * ZOOM;
      var half = gA / (2 * kk);
      cx = clamp(.9 + clamp((1.2 - gA) / .8, 0, 1) * .12, half, Math.max(half, DESIGN_W - half));
      rowWL = Math.floor(((WL - cy) * kk + .5) * H / lh);
      ready = false;
    }

    function draw(t) {
      if (!ready) buildStatic();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(staticCv, 0, 0);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

      var j, ii, c, r;
      for (j = 0; j < dynIdx.length; j++) {
        ii = dynIdx[j]; c = ii % cols; r = (ii - c) / cols;
        dynCell(ii, c, r, t);
        dynChar[ii] = oc; dynKey[ii] = keyOf();
      }
      paintBuckets(ctx, dynIdx, dynIdx.length, dynChar, dynKey);

      // falling petals
      ctx.fillStyle = 'rgb(255,200,196)';
      for (var q = 0; q < PETALS.length; q++) {
        var pt = PETALS[q], age = (t + pt.ph) % pt.life;
        var px = pt.ox + pt.vx * age + Math.sin(age * pt.sp + pt.ph) * pt.sw;
        var py = pt.oy + pt.vy * age + Math.sin(age * pt.sp * 1.3 + pt.ph) * pt.sw * .5;
        var cu = ((px - cx) * kk + gA / 2) * H / cw, cr = ((py - cy) * kk + .5) * H / lh - .5;
        if (cu < 0 || cr < 0 || cu >= cols || cr >= rows) continue;
        ctx.fillText(pt.ch, Math.floor(cu) * cw, Math.floor(cr) * lh + lh / 2);
      }
    }

    /* ---------- run ---------- */
    var params = new URLSearchParams(location.search);
    var still = params.has('t') ? parseFloat(params.get('t')) : null;
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var paused = false, start = performance.now(), pausedAt = 0, last = 0;

    resize();
    if (still !== null || reduce) {
      var drawStill = function () { draw(still !== null ? still : 6); };
      drawStill();
      window.addEventListener('resize', function () { resize(); drawStill(); });
      return;
    }

    function loop(now) {
      requestAnimationFrame(loop);
      if (paused || document.hidden) return;
      if (now - last < 1000 / 20) return; // 20 fps keeps it light and a little hand-made
      last = now;
      draw((now - start) / 1000);
    }
    requestAnimationFrame(loop);

    var rt;
    window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(resize, 120); });
    window.addEventListener('keydown', function (e) {
      if (e.code === 'Space' && e.target === document.body) {
        e.preventDefault();
        if (paused) { start += performance.now() - pausedAt; paused = false; } else { paused = true; pausedAt = performance.now(); }
      }
    });
  })();
  </script>
</body>
</html>
